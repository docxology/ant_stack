[project]
name = "ant-stack"
version = "2.0.0"
description = "Modular scientific publication and analysis framework for Ant Stack research."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Daniel Ari Friedman", email = "daniel@activeinference.institute" }
]
dependencies = [
  "jinja2>=3.1",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.0",
  "pillow>=10.0",
  "psutil>=5.9",
  "pyyaml>=6.0",
  "scipy>=1.11",
  "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.0",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-benchmark>=4.0",
  "pytest-cov>=5.0",
  "pytest-mock>=3.12",
  "pytest-xdist>=3.5",
  "ruff>=0.5",
]

[project.scripts]
antstack-build = "antstack_core.cli.build:main"
antstack-ce = "antstack_core.cli.ce:main"
run-all-antstack = "antstack_core.cli.run_all:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "antstack_core",
  "antstack_core.analysis",
  "antstack_core.cli",
  "antstack_core.cohereants",
  "antstack_core.figures",
  "antstack_core.mathematics",
  "antstack_core.orchestration",
  "antstack_core.publishing",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--import-mode=importlib"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
  ".git",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "__pycache__",
  "htmlcov",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
ignore = [
  "E501",
]
