# Analytical manuscript configuration; no empirical/publication-readiness claim.
paper:
  name: "complexity_energetics"
  title: "Computational Complexity and Energetics of the Ant Stack"
  subtitle: "Analytical Workload Models and Explicit Energy Accounting"
  author: "Daniel Ari Friedman"
  email: "daniel@activeinference.institute"
  orcid: "0000-0001-6232-9096"
  historical_record_doi: "10.5281/zenodo.17238737"  # Published v1 (2025), not this revised source.
  output_filename: "2_complexity_energetics.pdf"
  study_type: "analytical models with illustrative assumed coefficients"

content:
  files:
    - "Abstract.md"
    - "README.md"
    - "Background.md"
    - "Complexity.md"
    - "Energetics.md"
    - "Scaling.md"
    - "Methods.md"
    - "Generated.md"
    - "Results.md"
    - "Discussion.md"
    - "Acknowledgements.md"
    - "Resources.md"
    - "Appendices.md"
assets:
  figures_dir: "assets/figures"
  mermaid_dir: "assets/mermaid"
  tmp_dir: "assets/tmp_images"
build:
  has_generated_content: true
  has_computational_analysis: true
  mermaid_preprocessing: true
  cross_reference_validation: true
analysis:
  manifest_file: "manifest.example.yaml"
  runner_module: "antstack_core.orchestration.complexity_energetics"
  output_dir: "out"
latex:
  document_class: "article"
  geometry: "margin=2.5cm"
  mainfont: "Latin Modern Roman"
  mathfont: "Latin Modern Math"
  bibliography: "references.bib"
validation:
  check_cross_references: true
  check_figure_captions: true
  check_unicode_symbols: true
  require_descriptive_links: true
  validate_analysis_outputs: true
# Statistical settings, workload dimensions and energy inputs live only in the manifest.
