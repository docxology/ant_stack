name: Validate

on:
  push:
    branches: [main, 'wfz/**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Tests, papers, canonical run and installed wheel
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      UV_PYTHON: '3.15.2'
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/cache/python
      UV_PYTHON_BIN_DIR: ${{ github.workspace }}/cache/python-bin
      UV_PYTHON_CACHE_DIR: ${{ github.workspace }}/cache/python-downloads
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
      UV_CACHE_DIR: ${{ github.workspace }}/cache/uv
      UV_LOCKED: 'true'
      UV_PYTHON_PREFERENCE: only-managed
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/cache/bun
      npm_config_cache: ${{ github.workspace }}/cache/npm
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/cache/puppeteer
      MPLBACKEND: Agg
      MPLCONFIGDIR: ${{ github.workspace }}/cache/matplotlib
      XDG_CACHE_HOME: ${{ github.workspace }}/cache/xdg-cache
      XDG_CONFIG_HOME: ${{ github.workspace }}/cache/xdg-config
      XDG_DATA_HOME: ${{ github.workspace }}/cache/xdg-data
      XDG_STATE_HOME: ${{ github.workspace }}/cache/xdg-state
      XDG_RUNTIME_DIR: ${{ github.workspace }}/cache/xdg-runtime
      TEXMFVAR: ${{ github.workspace }}/cache/texmf-var
      TEXMFCONFIG: ${{ github.workspace }}/cache/texmf-config
      TEXMFHOME: ${{ github.workspace }}/cache/texmf-home
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/cache/pycache
      RUFF_CACHE_DIR: ${{ github.workspace }}/cache/ruff
      PYTHONNOUSERSITE: '1'
    steps:
      - name: Check out tested source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Initialize local output namespaces and capture source identity
        run: |
          set -euo pipefail
          mkdir -p cache/ci/{logs,reports,metadata} cache/tmp cache/xdg-runtime
          chmod 700 cache/xdg-runtime
          echo "TMPDIR=$GITHUB_WORKSPACE/cache/tmp" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          def git(*args):
              return subprocess.check_output(['git', *args], stdin=subprocess.DEVNULL).decode().strip()
          tracked = subprocess.check_output(['git', 'ls-files', '-z'], stdin=subprocess.DEVNULL).split(b'\0')
          identities = {}
          for raw in tracked:
              if not raw:
                  continue
              path = root / os.fsdecode(raw)
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f'Non-regular tracked source: {path}')
              identities[path.relative_to(root).as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()
          metadata = {
              'checked_out_sha': git('rev-parse', 'HEAD'),
              'checked_out_tree': git('rev-parse', 'HEAD^{tree}'),
              'event_name': os.environ['GITHUB_EVENT_NAME'],
              'event_sha': os.environ['GITHUB_SHA'],
              'ref': os.environ['GITHUB_REF'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'source_sha256': identities,
              'qualification': 'Compilation/artifact integrity only; no visual acceptance or empirical validation.',
          }
          pathlib.Path('cache/ci/metadata/source.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PY

      - name: Set up pinned uv and managed Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.13.7'
          python-version: '3.15.2'
          enable-cache: false

      - name: Set up pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.13.0'

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'

      - name: Install optional publishing and browser system dependencies
        run: |
          set -euo pipefail
          {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              ca-certificates curl texlive-xetex texlive-latex-extra texlive-fonts-recommended \
              fonts-lmodern lmodern librsvg2-bin poppler-utils ffmpeg \
              libasound2 libatk-bridge2.0-0 libatk1.0-0 libcups2 libdrm2 libgbm1 \
              libgtk-3-0 libnspr4 libnss3 libx11-xcb1 libxcomposite1 libxdamage1 \
              libxfixes3 libxrandr2 libxkbcommon0 xdg-utils
            kpsewhich cleveref.sty
          } 2>&1 | tee cache/ci/logs/system-dependencies.log

      - name: Install checksum-verified workspace Pandoc
        run: |
          set -euo pipefail
          {
            mkdir -p cache/tools
            curl --fail --location --proto '=https' --tlsv1.2 \
              https://github.com/jgm/pandoc/releases/download/3.13/pandoc-3.13-linux-amd64.tar.gz \
              --output cache/tools/pandoc-3.13-linux-amd64.tar.gz
            echo '38aa33b325a2bc96a4c39409631212db55702f564250bcdbead180b3bf646389  cache/tools/pandoc-3.13-linux-amd64.tar.gz' | sha256sum --check --strict
            tar -xzf cache/tools/pandoc-3.13-linux-amd64.tar.gz -C cache/tools
            cache/tools/pandoc-3.13/bin/pandoc --version
            echo "$GITHUB_WORKSPACE/cache/tools/pandoc-3.13/bin" >> "$GITHUB_PATH"
          } 2>&1 | tee cache/ci/logs/pandoc-install.log

      - name: Install checksum-verified private fvextra 1.14.0
        run: |
          set -euo pipefail
          {
            target="$TEXMFHOME/tex/latex/fvextra/fvextra.sty"
            mkdir -p "$(dirname "$target")"
            curl --fail --location --proto '=https' --tlsv1.2 \
              https://raw.githubusercontent.com/gpoore/fvextra/b22ac9e0806479bfe69bf6f2fd2c052b50a3b5cf/fvextra/fvextra.sty \
              --output "$target"
            echo "e91f5114fb99355111835093f4f736fa1d4887fafd09910a65db0dd1ac347fab  $target" | sha256sum --check --strict
            test "$(kpsewhich fvextra.sty)" = "$target"
            python3 - <<'PY'
          import hashlib, json, os, pathlib
          path = pathlib.Path(os.environ['TEXMFHOME']) / 'tex/latex/fvextra/fvextra.sty'
          pathlib.Path('cache/ci/metadata/tex-addons.json').write_text(json.dumps({
              'fvextra': {'version': '1.14.0', 'source_commit': 'b22ac9e0806479bfe69bf6f2fd2c052b50a3b5cf',
                          'source': 'https://github.com/gpoore/fvextra', 'path': str(path),
                          'sha256': hashlib.sha256(path.read_bytes()).hexdigest()}
          }, indent=2) + '\n')
          PY
          } 2>&1 | tee cache/ci/logs/tex-addons-install.log

      - name: Install locked project dependencies and pinned browser
        run: |
          set -euo pipefail
          {
            uv sync --locked --extra dev
            bun install --frozen-lockfile
            # Invoke the locked package's real installer directly: install.mjs catches errors.
            node --input-type=module - <<'JS'
          import {downloadBrowsers} from 'puppeteer/internal/node/install.js';
          await downloadBrowsers();
          JS
            browser="$(node --input-type=module -e "import puppeteer from 'puppeteer'; console.log(await puppeteer.executablePath());")"
            test -x "$browser"
            case "$browser" in "$PUPPETEER_CACHE_DIR"/*) ;; *) echo 'Browser escaped project cache' >&2; exit 1 ;; esac
            echo "PUPPETEER_EXECUTABLE_PATH=$browser" >> "$GITHUB_ENV"
            echo "ANTSTACK_MMDC=$GITHUB_WORKSPACE/node_modules/.bin/mmdc" >> "$GITHUB_ENV"
            "$browser" --version
          } 2>&1 | tee cache/ci/logs/project-dependencies.log

      - name: Capture exact toolchain inventory
        run: |
          set -euo pipefail
          {
            uv --version
            uv python list --only-installed
            uv python find
            uv run python -VV
            bun --version
            node --version
            pandoc --version
            xelatex --version
            rsvg-convert --version
            pdfinfo -v
            ffmpeg -version
            "$PUPPETEER_EXECUTABLE_PATH" --version
          } 2>&1 | tee cache/ci/metadata/runtimes.txt
          uv run python - <<'PY'
          import importlib.metadata, json, pathlib, platform, sys
          pathlib.Path('cache/ci/metadata/python.json').write_text(json.dumps({
              'executable': sys.executable, 'version': sys.version, 'platform': platform.platform(),
              'distributions': sorted((d.metadata['Name'], d.version) for d in importlib.metadata.distributions()),
          }, indent=2) + '\n')
          PY
          dpkg-query -W -f='${Package}\t${Version}\n' > cache/ci/metadata/system-packages.txt

      - name: Collect and run the complete test suite
        run: |
          set -euo pipefail
          uv run pytest --collect-only -q 2>&1 | tee cache/ci/logs/pytest-collection.log
          uv run pytest -q --junitxml=cache/ci/reports/pytest.xml --basetemp=cache/ci/pytest-tmp -o cache_dir=cache/ci/pytest-cache 2>&1 | tee cache/ci/logs/pytest.log
          uv run python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('cache/ci/reports/pytest.xml').getroot()
          if root.findall('.//skipped'):
              raise SystemExit('Skipped tests do not qualify this full-suite gate')
          PY

      - name: Check Ruff and folder documentation contracts
        run: |
          set -euo pipefail
          uv run ruff check . 2>&1 | tee cache/ci/logs/ruff.log
          uv run python tools/ensure_folder_docs.py --check 2>&1 | tee cache/ci/logs/folder-docs.log

      - name: Stage original configured paper inputs and canonical config
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import hashlib, json, pathlib, shutil, yaml
          stage = pathlib.Path('cache/ci/paper-project')
          stage.mkdir()
          papers = pathlib.Path('papers')
          if any(path.is_symlink() for path in papers.rglob('*')):
              raise SystemExit('Paper staging refuses symlink inputs')
          shutil.copytree(papers, stage / 'papers')
          expected = {'ant_stack', 'complexity_energetics', 'documentation'}
          discovered = {p.parent.name for p in (stage / 'papers').glob('*/paper_config.yaml')}
          if discovered != expected:
              raise SystemExit(f'Configured paper set changed: {discovered}')
          hashes = {p.relative_to(stage).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in sorted(stage.rglob('*')) if p.is_file()}
          pathlib.Path('cache/ci/metadata/paper-inputs.json').write_text(json.dumps(hashes, indent=2) + '\n')
          source = pathlib.Path('configs/run_all_antstack.example.yaml')
          config = yaml.safe_load(source.read_text())
          config['run']['output_root'] = 'cache/ci/canonical'
          config['complexity_energetics']['paper_root'] = 'cache/ci/canonical-projection'
          pathlib.Path('cache/ci/metadata/run_all_ci.yaml').write_text(yaml.safe_dump(config, sort_keys=False))
          shutil.copyfile(source, 'cache/ci/metadata/run_all_original.yaml')
          shutil.copyfile('papers/complexity_energetics/manifest.example.yaml', 'cache/ci/metadata/manifest-input.yaml')
          pathlib.Path('cache/ci/metadata/config-redirections.json').write_text(json.dumps({
              'source': str(source), 'changes': {
                  'run.output_root': [yaml.safe_load(source.read_text())['run']['output_root'], config['run']['output_root']],
                  'complexity_energetics.paper_root': ['papers/complexity_energetics', config['complexity_energetics']['paper_root']],
              }, 'unchanged': 'All task flags, coefficients, seeds, statistics, animations, validation settings and ordered PDF source paths. Conceptual assets are regenerated from current bound sources.'
          }, indent=2) + '\n')
          PY

      - name: Regenerate and bind both conceptual graphical abstracts
        run: |
          set -euo pipefail
          uv run python tools/generate_graphical_abstracts.py --output cache/ci/graphical-abstracts 2>&1 | tee cache/ci/logs/graphical-abstracts.log
          uv run python - <<'PY'
          import hashlib, json, pathlib, shutil
          root = pathlib.Path.cwd()
          stored = json.loads(pathlib.Path('papers/graphical_abstracts/graphical_abstracts.provenance.json').read_text())
          for item in [stored['producer'], *stored['sources']]:
              path = root / item['path']
              if not path.resolve().is_relative_to(root) or hashlib.sha256(path.read_bytes()).hexdigest() != item['sha256']:
                  raise SystemExit(f"Stale tracked graphical source identity: {item['path']}")
          for item in stored['assets']:
              data = (root / 'papers/graphical_abstracts' / item['path']).read_bytes()
              if len(data) != item['size_bytes'] or hashlib.sha256(data).hexdigest() != item['sha256']:
                  raise SystemExit(f"Corrupt tracked graphical export: {item['path']}")
          fresh = pathlib.Path('cache/ci/graphical-abstracts')
          receipt = json.loads((fresh / 'graphical_abstracts.provenance.json').read_text())
          target = pathlib.Path('cache/ci/paper-project/papers/graphical_abstracts')
          for name in receipt['output_inventory']:
              if pathlib.Path(name).name != name:
                  raise SystemExit('Invalid graphical export address')
              shutil.copyfile(fresh / name, target / name)
          stage = pathlib.Path('cache/ci/paper-project')
          identities = {p.relative_to(stage).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                        for p in sorted(stage.rglob('*')) if p.is_file()}
          pathlib.Path('cache/ci/metadata/paper-inputs-with-fresh-graphics.json').write_text(json.dumps(identities, indent=2) + '\n')
          PY

      - name: Validate installed command entrypoints without source projections
        run: |
          set -euo pipefail
          uv run antstack-build --project-root cache/ci/paper-project --validate-only 2>&1 | tee cache/ci/logs/validate-build.log
          uv run antstack-ce papers/complexity_energetics/manifest.example.yaml --validate-only 2>&1 | tee cache/ci/logs/validate-ce.log
          uv run run-all-antstack --config cache/ci/metadata/run_all_ci.yaml --validate-only 2>&1 | tee cache/ci/logs/validate-run-all.log

      - name: Build a new sdist then a wheel from that sdist
        run: |
          set -euo pipefail
          version="$(uv version --short)"
          {
            # Build the wheel from the new sdist, not an old build/lib tree.
            uv build --sdist --out-dir dist
            uv build --wheel "dist/ant_stack-${version}.tar.gz" --out-dir dist
            sha256sum "dist/ant_stack-${version}.tar.gz" "dist/ant_stack-${version}-py3-none-any.whl"
          } 2>&1 | tee cache/ci/logs/package-build.log

      - name: Exercise the isolated installed wheel
        run: |
          set -euo pipefail
          version="$(uv version --short)"
          uv run python tools/release_smoke.py --wheel "dist/ant_stack-${version}-py3-none-any.whl" --work-dir cache/install-proof --require-pdf 2>&1 | tee cache/ci/logs/installed-package-smoke.log

      - name: Generate the distinct enhanced-model manuscript supplements
        run: |
          set -euo pipefail
          uv run python -m antstack_core.analysis.ce_tables_and_numbers --output cache/ci/enhanced-supplements 2>&1 | tee cache/ci/logs/enhanced-supplements.log
          uv run python scripts/complexity_energetics/generate_manuscript_figures.py --output cache/ci/figure-families/manuscript 2>&1 | tee cache/ci/logs/manuscript-figures.log
          uv run python scripts/complexity_energetics/generate_results_figures.py --output cache/ci/figure-families/results 2>&1 | tee cache/ci/logs/results-figures.log
          uv run python scripts/complexity_energetics/generate_publication_figures.py --output cache/ci/figure-families/publication --format svg 2>&1 | tee cache/ci/logs/publication-figures.log
          uv run python scripts/complexity_energetics/generate_multipanel_figures.py --output cache/ci/figure-families/multipanel 2>&1 | tee cache/ci/logs/multipanel-figures.log
          uv run python scripts/complexity_energetics/analyze_contact_dynamics.py --output cache/ci/analyses/contact 2>&1 | tee cache/ci/logs/contact-analysis.log
          uv run python scripts/complexity_energetics/analyze_neural_networks.py --output cache/ci/analyses/neural 2>&1 | tee cache/ci/logs/neural-analysis.log
          uv run python scripts/complexity_energetics/analyze_active_inference.py --output cache/ci/analyses/planning 2>&1 | tee cache/ci/logs/planning-analysis.log
          uv run python scripts/complexity_energetics/comprehensive_analysis.py --output cache/ci/analyses/comprehensive 2>&1 | tee cache/ci/logs/comprehensive-analysis.log
          uv run python scripts/complexity_energetics/generate_comprehensive_analysis.py --output cache/ci/analyses/scaling 2>&1 | tee cache/ci/logs/module-scaling-analysis.log

      - name: Render the supplementary multipanel captions
        run: |
          set -euo pipefail
          uv run python - <<'PY' 2>&1 | tee cache/ci/logs/multipanel-tex.log
          import pathlib, shutil, subprocess
          source = pathlib.Path('cache/ci/figure-families/multipanel')
          work = pathlib.Path('cache/ci/multipanel-tex')
          work.mkdir()
          for name in ('comprehensive_scaling_multipanel.png', 'theoretical_limits_multipanel.png', 'multipanel_figures.tex'):
              shutil.copyfile(source / name, work / name)
          commands = ('documentclass{article}', 'usepackage[margin=1in]{geometry}', 'usepackage{graphicx}', 'begin{document}', 'input{multipanel_figures.tex}', 'end{document}')
          (work / 'document.tex').write_text(''.join(chr(92) + command for command in commands))
          subprocess.run(['xelatex', '-interaction=nonstopmode', '-halt-on-error', 'document.tex'], cwd=work, stdin=subprocess.DEVNULL, check=True, timeout=180)
          text = subprocess.check_output(['pdftotext', str(work / 'document.pdf'), '-'], stdin=subprocess.DEVNULL).decode()
          (work / 'document.txt').write_text(text)
          if 'extbf' in text:
              raise SystemExit('Corrupt TeX command visible in rendered captions')
          PY

      - name: Actually build every configured paper in the staged project
        run: |
          set -euo pipefail
          uv run antstack-build --project-root cache/ci/paper-project 2>&1 | tee cache/ci/logs/paper-build.log
          uv run python - <<'PY'
          import pathlib
          root = pathlib.Path('cache/ci/paper-project')
          for name in ('1_ant_stack.pdf', '2_complexity_energetics.pdf', '1_ant_stack_documentation.pdf'):
              path = root / name
              if not path.is_file() or not path.read_bytes().startswith(b'%PDF-'):
                  raise SystemExit(f'Missing new configured PDF: {path}')
          PY

      - name: Execute the canonical configured run with all configured tasks
        run: |
          set -euo pipefail
          run_id="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' "uv run run-all-antstack --config cache/ci/metadata/run_all_ci.yaml --run-id $run_id" | tee cache/ci/metadata/canonical-invocation.txt
          uv run run-all-antstack --config cache/ci/metadata/run_all_ci.yaml --run-id "$run_id" 2>&1 | tee cache/ci/logs/canonical-run.log
          test -s "cache/ci/canonical/$run_id/manifest.json"

      - name: Verify the tested source stayed unchanged
        if: always() && hashFiles('cache/ci/metadata/source.json') != ''
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path.cwd()
          expected = json.loads(pathlib.Path('cache/ci/metadata/source.json').read_text())
          changed = []
          for name, digest in expected['source_sha256'].items():
              path = root / name
              if path.is_symlink() or not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest() != digest:
                  changed.append(name)
          status = subprocess.check_output(['git', '-c', 'diff.autoRefreshIndex=false', 'status', '--porcelain=v1'], stdin=subprocess.DEVNULL).decode()
          result = {'source_commit': expected['checked_out_sha'], 'changed_tracked_paths': changed,
                    'git_status': status, 'source_unchanged': not changed and not status}
          pathlib.Path('cache/ci/metadata/source-after.json').write_text(json.dumps(result, indent=2) + '\n')
          if not result['source_unchanged']:
              raise SystemExit('Gate changed source; inspect source-after.json')
          PY

      - name: Collect only allowlisted result files, even on gate failure
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, shutil, tomllib
          root = pathlib.Path.cwd().resolve()
          destination = root / 'cache/ci/artifacts'
          destination.mkdir(parents=True, exist_ok=False)
          def copy(source, target):
              path = root / source
              if not path.exists():
                  return
              if path.is_symlink() or not path.is_file() or not path.resolve().is_relative_to(root):
                  raise SystemExit(f'Unsafe artifact: {path}')
              output = destination / target
              output.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(path, output)
          for directory, suffixes in (
              ('cache/ci/logs', {'.log'}),
              ('cache/ci/reports', {'.xml'}),
              ('cache/ci/metadata', {'.json', '.txt', '.yaml'}),
              ('cache/ci/graphical-abstracts', {'.json', '.png', '.svg'}),
          ):
              for path in sorted((root / directory).glob('*')):
                  if path.suffix in suffixes:
                      copy(path.relative_to(root), pathlib.Path(pathlib.Path(directory).name) / path.name)
          for directory in ('cache/ci/enhanced-supplements', 'cache/ci/figure-families', 'cache/ci/analyses', 'cache/ci/multipanel-tex'):
              base = root / directory
              for path in sorted(base.rglob('*')):
                  if path.is_file() and path.suffix in {'.json', '.md', '.png', '.svg', '.pdf', '.tex', '.yaml', '.yml', '.csv', '.txt'}:
                      copy(path.relative_to(root), pathlib.Path(base.name) / path.relative_to(base))
          for name in ('1_ant_stack.pdf', '2_complexity_energetics.pdf', '1_ant_stack_documentation.pdf', 'build_report.md'):
              copy(pathlib.Path('cache/ci/paper-project') / name, pathlib.Path('papers') / name)
          allowed = {'.json', '.yaml', '.csv', '.md', '.png', '.svg', '.gif', '.html', '.mp4', '.log', '.pdf'}
          canonical = root / 'cache/ci/canonical'
          for path in sorted(canonical.rglob('*')):
              if path.is_file() and path.suffix in allowed:
                  copy(path.relative_to(root), pathlib.Path('canonical') / path.relative_to(canonical))
          version = tomllib.loads((root / 'pyproject.toml').read_text())['project']['version']
          for name in (f'ant_stack-{version}.tar.gz', f'ant_stack-{version}-py3-none-any.whl'):
              copy(pathlib.Path('dist') / name, pathlib.Path('packages') / name)
          smoke = pathlib.Path('cache/install-proof')
          for name in ('receipt.json', 'runtime-requirements.txt', 'caller/consumer.pdf',
                       'caller/manifest.yaml', 'caller/invalid.yaml', 'caller/run-config.yaml',
                       'caller/papers/consumer/paper_config.yaml'):
              copy(smoke / name, pathlib.Path('installed-smoke') / name)
          for path in sorted((root / smoke / 'commands').glob('*')):
              if path.suffix in {'.stdout', '.stderr'}:
                  copy(path.relative_to(root), pathlib.Path('installed-smoke/commands') / path.name)
          for path in sorted((root / smoke / 'caller/papers/consumer').glob('*.md')):
              copy(path.relative_to(root), pathlib.Path('installed-smoke/caller/papers/consumer') / path.name)
          for namespace in ('caller/ce-output', 'caller/runs/installed-smoke'):
              base = root / smoke / namespace
              for path in sorted(base.rglob('*')):
                  if path.is_file() and path.suffix in allowed:
                      copy(path.relative_to(root), pathlib.Path('installed-smoke') / namespace / path.relative_to(base))
          # Never collect the smoke venv, home, cache, tmp, texmf or config/data/state trees.
          inventory = {p.relative_to(destination).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                       for p in sorted(destination.rglob('*')) if p.is_file()}
          (destination / 'artifact-sha256.json').write_text(json.dumps(inventory, indent=2) + '\n')
          PY

      - name: Preserve scoped validation evidence, not dependencies or credentials
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: validation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: cache/ci/artifacts/
          if-no-files-found: error
          # Includes only the explicitly collected canonical ownership JSON, not arbitrary hidden trees.
          include-hidden-files: true
          retention-days: 14
